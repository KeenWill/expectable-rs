[package]
name = "expectable"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Serde-based text tables for expect tests"
license = "MIT"
repository = "https://github.com/KeenWill/expectable-rs"
readme = "README.md"

[dependencies]
serde = "1"
unicode-width = "0.2"

[dev-dependencies]
expect-test = "1"
serde_derive = "1"
